# 全项目统一 lint 入口：各 package 的 analysis_options.yaml 通过
# `include: package:base_lints/analysis_options.yaml` 引用本文件。
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - use_setters_to_change_properties
