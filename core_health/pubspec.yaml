name: core_health
description: 健康数据域（L4 手机计步 + 休眠的健康中枢接口；Pro 期手表回归）
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.12.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_model:
    path: ../core_model
  base_utils:
    path: ../base_utils
  # 慢植物姿态源(设计方案 §3.2):前置摄像头 + 端上人脸欧拉角
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  health: ^13.3.2
  shared_preferences: ^2.5.3

dev_dependencies:
  base_lints:
    path: ../base_lints
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
